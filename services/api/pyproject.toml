[project]
name = "priveo-api"
version = "0.1.0"
description = "Priveo Car Concierge API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23",
  "pyjwt>=2.9",
  "ortools>=9.10",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
# openpyxl is only for the one-time customer load (scripts/import_customers.py).
dev = ["pytest>=8", "coverage>=7.16,<8", "httpx>=0.27", "ruff>=0.6", "openpyxl>=3.1", "pypdf>=6"]

[tool.setuptools.package-data]
"app.billing" = ["assets/*.ttf", "assets/OFL.txt"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Named here so that every ruff version checks the same rules.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "RUF100"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "app.platform.deps.require_role"]
