<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Priveo Showroom Splash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
/* Layout concept: one full-screen black showroom. A gold line-art sedan draws under a spotlight, a polish sheen crosses the paint, then the real Priveo logo rises beneath it.
   Palette is black and the logo's own champagne gold. No maroon. */
:root{
  --ink:#050506;
  --ink-2:#0B0B0D;
  --ink-3:#131316;
  --gold:#D6B56A;
  --gold-hi:#F1D98E;
  --gold-lo:#9C7A34;
  --ivory:#EFE6D2;
  --chrome-mute:#8C857C;
  --f-sans:'Jost','Futura','Avenir Next',system-ui,sans-serif;
  --f-serif:'Cormorant Garamond',Georgia,serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--ink);
  color:var(--ivory);
  font-family:var(--f-sans);
  font-size:13px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
  overflow:hidden;
}
.area{flex:1;min-height:240px;position:relative;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.device{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;isolation:isolate;container-type:size;background:var(--ink);cursor:pointer;
  box-shadow:0 0 0 7px #000,0 0 0 8px #2a2a2e,0 40px 90px rgba(0,0,0,.7)}
.device.bleed{box-shadow:none}
.hint{margin:0;text-align:center;color:var(--chrome-mute);font-size:12px;letter-spacing:.14em}
.hint button{background:none;border:0;color:var(--gold);font:inherit;letter-spacing:inherit;cursor:pointer;padding:4px 6px;text-decoration:underline;text-underline-offset:3px}
.hint button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:559px){body{padding-block:0}.hint{display:none}}

.splash{position:absolute;inset:0;overflow:hidden;
  background:linear-gradient(180deg,#141416 0%,#0A0A0B 52%,#050506 100%)}
.splash *{pointer-events:none}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.vignette{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%)}
.beam{position:absolute;left:0;right:0;top:0;height:72cqh;background:radial-gradient(55% 88% at 50% 0%,rgba(241,217,142,.20),transparent 72%)}
.floor{position:absolute;left:50%;top:30cqh;width:120cqw;height:24cqh;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(214,181,106,.16),transparent)}
.halo{position:absolute;left:50%;top:44cqh;width:96cqw;height:62cqw;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(214,181,106,.10),transparent)}

.car{position:absolute;left:7cqw;right:7cqw;top:19cqh}
.car svg{display:block;width:100%;height:auto;overflow:visible}

.logo{position:absolute;left:10cqw;right:10cqw;top:47cqh;display:flex;flex-direction:column;align-items:center}
.logo img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.logo .mark{width:38.9%;margin-bottom:1cqw;filter:drop-shadow(0 0 2.4cqw rgba(214,181,106,.30))}
.logo .subimg{margin-top:3cqw}

.tag{position:absolute;left:0;right:0;bottom:12cqh;margin:0;text-align:center;padding:0 8cqw;
  font-family:var(--f-serif);font-style:italic;font-weight:500;font-size:5.2cqw;line-height:1.35;color:rgba(239,230,210,.82)}
.loader{position:absolute;left:50%;bottom:6.5cqh;width:26cqw;height:1px;transform:translateX(-50%);overflow:hidden;background:rgba(255,255,255,.14)}
.loader i{display:block;height:100%;background:linear-gradient(90deg,transparent,var(--gold-hi),var(--gold))}

svg [pathLength]{stroke-dasharray:1}
.c-wheel{transform-box:fill-box;transform-origin:center}
.c-gleam{transform:translateX(560px)}
.c-flare{opacity:.45;transform-box:fill-box;transform-origin:center}

/* timeline (seconds): ground .1, body .2-2.1, wheels 1.0, flare 1.9, sheen 2.0-3.7, mark 2.0, word 2.7, sub 3.3, tagline 3.7, loader to 4.4 */
.play .beam{animation:fade 1.6s ease .2s backwards}
.play .floor{animation:fade 1.6s ease .5s backwards}
.play .halo{animation:fade 1.8s ease 2s backwards}
.play .c-ground{animation:draw 1.4s ease .1s backwards}
.play .c-body{animation:draw 1.9s cubic-bezier(.65,.05,.25,1) .2s backwards,fillin 1s ease 1.7s backwards}
.play .c-win{animation:draw 1.2s ease .9s backwards}
.play .c-det{animation:fade 1s ease 1.5s backwards}
.play .c-ring{animation:draw 1s ease 1s backwards}
.play .c-refl{animation:fade 1.4s ease 1.8s backwards}
.play .c-wheel{animation:spin 1.8s cubic-bezier(.2,.7,.2,1) 1s backwards}
.play .c-gleam{animation:gleam 1.7s cubic-bezier(.4,0,.2,1) 2s backwards}
.play .c-flare{animation:flare 1.5s ease 1.9s backwards}
.play .mark{animation:markIn 1.3s var(--ease) 2s backwards}
.play .wordimg{animation:wipeR 1.2s cubic-bezier(.6,.05,.2,1) 2.7s backwards}
.play .subimg{animation:wipeC 1.1s cubic-bezier(.6,.05,.2,1) 3.3s backwards}
.play .tag{animation:rise2 1.1s ease 3.7s backwards}
.play .loader i{animation:load 4.4s cubic-bezier(.5,0,.2,1) backwards}

@keyframes draw{from{stroke-dashoffset:1}}
@keyframes fillin{from{fill-opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes spin{from{transform:rotate(-300deg)}}
@keyframes gleam{from{transform:translateX(-140px)}to{transform:translateX(560px)}}
@keyframes flare{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.4)}}
@keyframes markIn{from{opacity:0;clip-path:inset(100% 0 0 0);transform:translateY(2cqh) scale(.96)}}
@keyframes wipeR{from{opacity:0;clip-path:inset(0 100% 0 0)}}
@keyframes wipeC{from{opacity:0;clip-path:inset(0 50% 0 50%)}}
@keyframes rise2{from{opacity:0;transform:translateY(1.6cqh)}}
@keyframes load{from{transform:translateX(-101%)}}
@media (prefers-reduced-motion:reduce){.splash *{animation:none!important}}
</style>

  <div class="device" id="device">
    <section class="splash play" id="splash" aria-label="Priveo splash screen">

<script>
(function(){
  var G='#D6B56A',GH='#F1D98E',GL='#9C7A34';
  var BODY='M26 98 L24 82 C24 73 32 69 50 66 L100 58 C120 54 136 38 160 34 C180 31 222 31 244 34 C268 40 288 54 312 60 L352 67 C368 70 374 76 375 86 L376 98 L333 98 A27 27 0 0 0 279 98 L123 98 A27 27 0 0 0 69 98 Z';
  function wheel(cx){
    var s='';
    for(var i=0;i<5;i++){var a=i*72*Math.PI/180-Math.PI/2;
      s+='<line x1="'+(4*Math.cos(a)).toFixed(2)+'" y1="'+(4*Math.sin(a)).toFixed(2)+'" x2="'+(13*Math.cos(a)).toFixed(2)+'" y2="'+(13*Math.sin(a)).toFixed(2)+'" stroke="'+G+'" stroke-width="1.4"/>';}
    return '<g transform="translate('+cx+' 98)"><g class="c-wheel">'
      +'<circle class="c-ring" pathLength="1" r="21" stroke="'+GH+'" stroke-width="1.6"/>'
      +'<circle r="14.5" stroke="'+G+'" stroke-width=".8" opacity=".6"/>'
      +s+'<circle r="3" stroke="'+GH+'" stroke-width="1"/></g></g>';
  }
  document.getElementById('carMount').innerHTML=
   '<svg viewBox="0 0 400 170" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
   +'<defs>'
   +'<linearGradient id="cg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="'+GL+'"/><stop offset=".5" stop-color="'+GH+'"/><stop offset="1" stop-color="'+G+'"/></linearGradient>'
   +'<linearGradient id="cf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+GH+'" stop-opacity=".14"/><stop offset="1" stop-color="'+G+'" stop-opacity=".03"/></linearGradient>'
   +'<linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF4D6" stop-opacity="0"/><stop offset=".5" stop-color="#FFF4D6" stop-opacity=".8"/><stop offset="1" stop-color="#FFF4D6" stop-opacity="0"/></linearGradient>'
   +'<linearGradient id="gg" gradientUnits="userSpaceOnUse" x1="14" y1="0" x2="386" y2="0"><stop offset="0" stop-color="'+G+'" stop-opacity="0"/><stop offset=".5" stop-color="'+GH+'"/><stop offset="1" stop-color="'+G+'" stop-opacity="0"/></linearGradient>'
   +'<linearGradient id="mg" gradientUnits="userSpaceOnUse" x1="0" y1="119" x2="0" y2="165"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>'
   +'<mask id="rm" maskUnits="userSpaceOnUse" x="0" y="119" width="400" height="51"><rect x="0" y="119" width="400" height="51" fill="url(#mg)"/></mask>'
   +'<radialGradient id="fl"><stop offset="0" stop-color="#FFF4D6"/><stop offset=".35" stop-color="'+GH+'" stop-opacity=".55"/><stop offset="1" stop-color="'+G+'" stop-opacity="0"/></radialGradient>'
   +'<clipPath id="bc"><path d="'+BODY+'"/></clipPath>'
   +'</defs>'
   +'<g mask="url(#rm)"><g class="c-refl" transform="translate(0 238) scale(1 -1)" opacity=".3"><path d="'+BODY+'" stroke="'+G+'" stroke-width="1.4"/></g></g>'
   +'<path class="c-ground" pathLength="1" d="M14 119 H386" stroke="url(#gg)" stroke-width="1"/>'
   +'<path class="c-body" pathLength="1" d="'+BODY+'" stroke="url(#cg)" stroke-width="1.7" fill="url(#cf)"/>'
   +'<g class="c-win">'
   +'<path pathLength="1" d="M118 54 C132 48 144 40 163 37.5 L197 37.5 L197 54 Z" stroke="'+G+'" stroke-width="1.1"/>'
   +'<path pathLength="1" d="M205 37.5 L241 37.5 C259 42 275 51 292 55 L205 55 Z" stroke="'+G+'" stroke-width="1.1"/>'
   +'</g>'
   +'<g class="c-det" stroke="'+G+'" stroke-width="1">'
   +'<path d="M40 76 C140 70 260 70 360 76" opacity=".5"/>'
   +'<path d="M201 55 L201 92" opacity=".6"/>'
   +'<path d="M178 66 H190 M214 66 H226" stroke-width="1.4"/>'
   +'<path d="M356 68 C364 69 370 72 373 77 L357 75 Z" fill="'+GH+'" fill-opacity=".5" stroke="'+GH+'"/>'
   +'<path d="M27 80 L40 75 L40 81 Z" fill="'+G+'" fill-opacity=".35" stroke="'+G+'"/>'
   +'</g>'
   +'<g clip-path="url(#bc)"><g class="c-gleam"><rect x="0" y="20" width="70" height="100" fill="url(#gl)" transform="skewX(-24)"/></g></g>'
   +wheel(96)+wheel(306)
   +'<circle class="c-flare" cx="364" cy="74" r="16" fill="url(#fl)"/>'
   +'</svg>';

  var area=document.getElementById('area'),dev=document.getElementById('device'),sp=document.getElementById('splash');
  function fit(){
    var aw=area.clientWidth,ah=area.clientHeight,narrow=window.innerWidth<560,w,h;
    if(narrow){w=aw;h=ah;dev.classList.add('bleed');}
    else{h=Math.min(ah-18,(aw-18)*19.5/9);w=h*9/19.5;dev.classList.remove('bleed');}
    dev.style.width=Math.max(w,0)+'px';dev.style.height=Math.max(h,0)+'px';
    dev.style.borderRadius=narrow?'0':(w*.12)+'px';
  }
  if(window.ResizeObserver)new ResizeObserver(fit).observe(area);
  window.addEventListener('resize',fit);fit();

  function play(){sp.classList.remove('play');void sp.offsetWidth;sp.classList.add('play');}
  dev.addEventListener('click',play);
  document.getElementById('replay').addEventListener('click',play);
  document.addEventListener('keydown',function(e){if(e.key==='r'||e.key==='R')play();});
})();
