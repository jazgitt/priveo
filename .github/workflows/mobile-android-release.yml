name: mobile-android-release

# Builds a signed Android bundle and uploads it to Play internal testing.
# Needs the secrets and variables listed in docs/build-and-release.md.
# Until ANDROID_KEYSTORE_BASE64 is set, the job is skipped.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "docs/brand/tokens.json"
      - "fastlane/**"
      - ".github/workflows/mobile-android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        if: env.HAS_KEYSTORE == 'true'
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true

      - name: Test before release
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Write the upload key
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile/android
        run: |
          umask 077
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload.jks
          cat > key.properties <<EOF
          storeFile=${GITHUB_WORKSPACE}/apps/mobile/android/upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed bundle
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile
        run: |
          # The Play app is in.priveo.app, so this is the prod flavor. In
          # Phase 0 it still starts from the dev entry point and the dev API.
          flutter build appbundle --release \
            --flavor prod \
            -t lib/main_dev.dart \
            --dart-define=API_BASE_URL=${{ vars.API_DEV_URL }} \
            --build-number=${{ github.run_number }}

      - uses: ruby/setup-ruby@v1
        if: env.HAS_KEYSTORE == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Upload to Play internal testing
        if: env.HAS_KEYSTORE == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android internal

      - name: Remove signing files
        if: always()
        run: rm -f apps/mobile/android/upload.jks apps/mobile/android/key.properties
