name: mobile-integration

# Runs the app on an Android emulator against the dev API and signs in as
# each role. It takes about 15 minutes, so it runs only when asked:
#   - by hand: Actions, mobile-integration, Run workflow
#     (or `gh workflow run mobile-integration`)
#   - on each merge to main that touches the app, when the repository
#     variable RUN_EMULATOR_ON_MERGE is `true`. It is off when unset.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logins:
    if: github.event_name == 'workflow_dispatch' || vars.RUN_EMULATOR_ON_MERGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_DEV_URL: ${{ vars.API_DEV_URL }}
      CUSTOMER_PASSWORD: ${{ secrets.MOCK_CUSTOMER_PASSWORD }}
      CREW_PASSWORD: ${{ secrets.MOCK_CREW_PASSWORD }}
      ADMIN_PASSWORD: ${{ secrets.MOCK_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: flutter pub get
        working-directory: apps/mobile

      - name: Sign in as each role on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 4096M
          working-directory: apps/mobile
          script: flutter test integration_test --dart-define=API_BASE_URL="$API_DEV_URL" --dart-define=LIVE_CUSTOMER_PASSWORD="$CUSTOMER_PASSWORD" --dart-define=LIVE_CREW_PASSWORD="$CREW_PASSWORD" --dart-define=LIVE_ADMIN_PASSWORD="$ADMIN_PASSWORD"
