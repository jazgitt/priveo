name: mobile-integration

# Runs the app on an Android emulator against the dev API and signs in as
# each role. It takes about 15 minutes, so it runs only when asked:
#   - by hand: Actions, mobile-integration, Run workflow
#     (or `gh workflow run mobile-integration`)
#   - on each merge to main that touches the app, when the repository
#     variable RUN_EMULATOR_ON_MERGE is `true`. It is off when unset.

# Two jobs: `logins` signs in with the shared dev accounts against the hosted dev
# API; `scenarios` starts the isolated fixture API (disposable SQLite) inside
# the job and checks fixture-manifest accounts. Neither writes to a hosted database.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-integration.yml"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [both, logins, scenarios]
        default: both

permissions:
  contents: read

concurrency:
  group: mobile-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logins:
    if: (github.event_name == 'workflow_dispatch' && inputs.job != 'scenarios') || vars.RUN_EMULATOR_ON_MERGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The demo logins exist on the test API only.
    environment: test
    env:
      API_TEST_URL: ${{ vars.API_URL }}
      CUSTOMER_PASSWORD: ${{ secrets.MOCK_CUSTOMER_PASSWORD }}
      CREW_PASSWORD: ${{ secrets.MOCK_CREW_PASSWORD }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo rm -rf /usr/local/.ghcup /usr/share/miniconda /usr/lib/google-cloud-sdk /opt/az /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy
          sudo docker system prune -af > /dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get
        working-directory: apps/mobile

      # Build the app before the emulator starts. Building while it boots
      # starves the emulator of CPU and it stops responding.
      - name: Pre-build the app
        working-directory: apps/mobile
        run: |
          flutter build apk --debug --flavor test -t lib/main_test.dart
          # Free the daemon's memory and the build output the emulator run does not reuse.
          (cd android && ./gradlew --stop) || true
          rm -rf build/app/outputs
          df -h /

      - name: Sign in as each role on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 2048M
          working-directory: apps/mobile
          script: flutter test integration_test/logins_test.dart --dart-define=API_BASE_URL="$API_TEST_URL" --dart-define=LIVE_CUSTOMER_PASSWORD="$CUSTOMER_PASSWORD" --dart-define=LIVE_CREW_PASSWORD="$CREW_PASSWORD" --dart-define=LIVE_ADMIN_PASSWORD="$ADMIN_PASSWORD"

  scenarios:
    if: (github.event_name == 'workflow_dispatch' && inputs.job != 'logins') || vars.RUN_EMULATOR_ON_MERGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCENARIO_PASSWORD: Priveo-Fixture-Scenario-123!
      SCENARIO_ADMIN_PASSWORD: Priveo-Fixture-Admin-123!
      FIXTURE_PORT: "8000"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo rm -rf /usr/local/.ghcup /usr/share/miniconda /usr/lib/google-cloud-sdk /opt/az /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy
          sudo docker system prune -af > /dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install the API
        working-directory: services/api
        run: pip install -e ".[dev]"

      - name: Build the fixture database and manifest
        working-directory: services/api
        env:
          ENVIRONMENT: test
          TEST_DATA_PASSWORD: ${{ env.SCENARIO_PASSWORD }}
          TEST_DATA_ADMIN_PASSWORD: ${{ env.SCENARIO_ADMIN_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/fixture"
          python scripts/test_data.py --database-file "$RUNNER_TEMP/fixture/e2e.sqlite3" --init --refresh all --output "$RUNNER_TEMP/fixture/manifest.json"
          python - <<'PY' > "$RUNNER_TEMP/fixture/manifest.compact.json"
          import json, os
          m = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "fixture", "manifest.json")))
          keep = ("id", "customer_login", "crew_logins")
          print(json.dumps({"scenarios": [{k: s[k] for k in keep} for s in m["scenarios"]]}, separators=(",", ":")))
          PY

      - name: Start the fixture API
        env:
          E2E_PYTHON: ${{ env.pythonLocation }}/bin/python
          ENVIRONMENT: test
          TEST_DATA_PASSWORD: ${{ env.SCENARIO_PASSWORD }}
        run: |
          nohup pwsh -NoProfile -File tools/test-data/start-api.ps1 -DatabaseFile "$RUNNER_TEMP/fixture/e2e.sqlite3" -Port "$FIXTURE_PORT" -SerializeRequests > "$RUNNER_TEMP/fixture/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "http://127.0.0.1:$FIXTURE_PORT/openapi.json" > /dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/fixture/api.log"
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get
        working-directory: apps/mobile

      # Build the app before the emulator starts. Building while it boots
      # starves the emulator of CPU and it stops responding.
      - name: Pre-build the app
        working-directory: apps/mobile
        run: |
          flutter build apk --debug --flavor test -t lib/main_test.dart
          # Free the daemon's memory and the build output the emulator run does not reuse.
          (cd android && ./gradlew --stop) || true
          rm -rf build/app/outputs
          df -h /

      - name: Check manifest scenarios on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 2048M
          working-directory: apps/mobile
          # 10.0.2.2 is the emulator's name for the runner.
          script: flutter test integration_test/scenarios_test.dart --dart-define=API_BASE_URL="http://10.0.2.2:$FIXTURE_PORT" --dart-define=SCENARIO_MANIFEST="$(cat $RUNNER_TEMP/fixture/manifest.compact.json)" --dart-define=SCENARIO_PASSWORD="$SCENARIO_PASSWORD" --dart-define=SCENARIO_ADMIN_PASSWORD="$SCENARIO_ADMIN_PASSWORD"

      - name: Keep the API log of a failed run
        if: failure()
        run: cat "$RUNNER_TEMP/fixture/api.log" || true
