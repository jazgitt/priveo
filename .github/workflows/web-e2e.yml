name: web-e2e

# Admin Web browser tests (Playwright). Runs the portal against the isolated
# fixture API on a disposable SQLite file; never touches a hosted database.
# See docs/testing/test-data-plan.md.

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "services/api/**"
      - "tools/test-data/**"
      - ".github/workflows/web-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install the API
        working-directory: services/api
        run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install the portal
        working-directory: apps/web
        run: npm ci
      - name: Install the browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run the browser tests
        working-directory: apps/web
        env:
          E2E_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: npm run e2e
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
