name: mobile-goldens

# Remakes the golden images on Linux and commits them to the pull request
# branch. Add the label "update-goldens" to a pull request to run it.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  update:
    if: github.event.label.name == 'update-goldens' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --update-goldens test/golden_test.dart
      - name: Commit the images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/goldens
          if git diff --cached --quiet; then
            echo "Golden images are unchanged."
          else
            git commit -m "Update golden images"
            git push
          fi
