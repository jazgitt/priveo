name: mobile-ci

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "docs/brand/tokens.json"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Theme is up to date with tokens.json
        run: |
          dart run tool/gen_theme.dart
          git diff --exit-code -- lib/core/ui/tokens.g.dart
      - name: Translations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
      - run: flutter analyze
      - run: flutter test
