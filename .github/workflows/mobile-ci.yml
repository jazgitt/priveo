name: mobile-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/mobile/**"
      - "docs/brand/tokens.json"
      - "packages/api-contract/openapi.json"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

# A newer push to the same PR cancels the older run, and a draft PR is not checked until it is marked ready.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Theme is up to date with tokens.json
        run: |
          dart run tool/gen_theme.dart
          git diff --exit-code -- lib/core/ui/tokens.g.dart
      - name: Translations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
      - name: API client is up to date with the contract
        run: |
          dart run tool/gen_api.dart
          git diff --exit-code -- lib/core/api/api.g.dart
      - run: flutter analyze
      - run: flutter test
      - name: Keep the golden differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: apps/mobile/test/failures
          if-no-files-found: ignore
