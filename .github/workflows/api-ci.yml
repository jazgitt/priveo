name: api-ci

on:
  pull_request:
    paths:
      - "services/api/**"
      - "packages/api-contract/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Contract check (openapi.json must match the code)
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- ../../packages/api-contract
