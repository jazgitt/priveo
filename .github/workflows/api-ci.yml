name: api-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "services/api/**"
      - "packages/api-contract/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

# A newer push to the same PR cancels the older run, and a draft PR is not checked until it is marked ready.
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: priveo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      # Switched off (owner, 2 Nov 2026): the PostgreSQL run below runs the same tests, and 11 minutes of
      # in-memory (SQLite) tests duplicated it. tools/dev/check-local.sh still runs both before a merge.
      # - name: Test (in-memory database)
      #   run: pytest -q
      - name: Test (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/priveo_test
        run: pytest -q
      - name: Contract check (openapi.json must match the code)
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- ../../packages/api-contract
