name: api-ci

on:
  pull_request:
    paths:
      - "services/api/**"
      - "packages/api-contract/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: priveo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]" pytest-timeout
      - name: Lint
        run: ruff check .
      - name: Test (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/priveo_test
        run: pytest -v -x --timeout=90 -p no:cacheprovider
      - name: Contract check (openapi.json must match the code)
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- ../../packages/api-contract
