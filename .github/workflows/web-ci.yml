name: web-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/web/**"
      - "docs/brand/tokens.json"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

# A newer push to the same PR cancels the older run, and a draft PR is not checked until it is marked ready.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint (also fails if the generated theme is stale)
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
