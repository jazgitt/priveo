name: web-ci

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "docs/brand/tokens.json"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint (also fails if the generated theme is stale)
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
# full CI run on main, 25 Oct 2026
