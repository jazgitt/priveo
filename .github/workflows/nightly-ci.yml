name: nightly-ci

# Unit tests of the nightly pipeline scripts (tools/nightly). Path-filtered like api-ci and web-ci;
# ci-gate runs on every pull request and passes when a check that did not start is simply absent.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/nightly/**"
      - ".github/workflows/nightly-ci.yml"

permissions:
  contents: read

concurrency:
  group: nightly-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-ci:
    name: nightly-ci
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Unit tests
        run: python -m pytest tools/nightly/tests -q
