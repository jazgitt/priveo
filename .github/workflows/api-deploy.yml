name: api-deploy

# Two deployments of the API, each with its own database (see
# docs/build-and-release.md):
#   test        every push to main  ->  api-deploy-vercel.yml, environment `test`
#   production  a v* tag, or a manual run with environment = production
#               ->  api-deploy-vercel.yml, environment `production`
# Test seeds the demo logins. Production never does. The production
# GitHub Environment should require a reviewer, so a release waits for approval.
# The host is chosen by the repository variable DEPLOY_PROVIDER:
#   vercel (default)  ->  jobs `test` and `production`
#   aws               ->  job `deploy-aws` (ECR + ECS), a single environment

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "docs/brand/tokens.json"
      - "tools/deploy/**"
      - ".github/workflows/api-deploy.yml"
      - ".github/workflows/api-deploy-vercel.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy the selected ref
        type: choice
        options: [test, production]
        default: test

permissions:
  id-token: write
  contents: read

jobs:
  test:
    if: >-
      ${{ (vars.DEPLOY_PROVIDER || 'vercel') == 'vercel'
      && ((github.event_name == 'push' && github.ref_type == 'branch')
          || (github.event_name == 'workflow_dispatch' && inputs.environment == 'test')) }}
    concurrency:
      group: api-deploy-test
      cancel-in-progress: false
    uses: ./.github/workflows/api-deploy-vercel.yml
    with:
      environment: test
      demo: true
    secrets: inherit

  production:
    if: >-
      ${{ (vars.DEPLOY_PROVIDER || 'vercel') == 'vercel'
      && ((github.event_name == 'push' && github.ref_type == 'tag')
          || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')) }}
    concurrency:
      group: api-deploy-production
      cancel-in-progress: false
    uses: ./.github/workflows/api-deploy-vercel.yml
    with:
      environment: production
      demo: false
    secrets: inherit

  deploy-aws:
    if: ${{ vars.DEPLOY_PROVIDER == 'aws' && vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build \
            --build-arg BUILD_NUMBER=${{ github.run_number }} \
            -t "$IMAGE" services/api
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Register a task definition with the new image
        id: taskdef
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > current.json
          jq --arg img "${{ steps.image.outputs.image }}" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)' \
            current.json > next.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://next.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy and wait
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke test
        env:
          SMOKE_CUSTOMER_PASSWORD: ${{ secrets.MOCK_CUSTOMER_PASSWORD }}
          SMOKE_CREW_PASSWORD: ${{ secrets.MOCK_CREW_PASSWORD }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.MOCK_ADMIN_PASSWORD }}
        run: python services/api/scripts/smoke_test.py "${{ vars.API_DEV_URL }}"
